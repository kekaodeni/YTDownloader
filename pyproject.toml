[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "0.5.0"
description = "Windows 11 Fluent desktop downloader powered by yt-dlp"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11,<7",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "curl-cffi==0.16.0",
    "requests[socks]>=2.34,<3",
    "Pillow>=12,<13",
    "semver==3.0.4",
    "cryptography==50.0.1",
]

[project.scripts]
yt-downloader = "yt_downloader.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "integration: exercises locally installed media tools without network access",
]

[tool.setuptools.package-data]
"yt_downloader.ui" = ["qml/*.qml"]
